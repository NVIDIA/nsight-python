name: "CI"

on:
  push:
    branches:
      - "main"
      - "pull-request/[0-9]+"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: "Running Lint"
        run: |
          pip install hatch
          hatch run lint:check

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: "Building Docs"
        run: |
          pip install hatch
          hatch run docs:build

  test-ncu:
    name: test-ncu (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        pytorch_image: ["nvcr.io/nvidia/pytorch:26.09-py3"]
        platform:
          - runner: linux-amd64-gpu-h100-latest-1
            ncu_installer_url: "https://developer.nvidia.com/downloads/assets/tools/secure/nsight-compute/2026_2_1/nsight_compute-linux-x86_64-2026.2.1.6.run"
          - runner: linux-arm64-gpu-l4-latest-1
            ncu_installer_url: "https://developer.nvidia.com/downloads/assets/tools/secure/nsight-compute/2026_2_1/nsight_compute-linux-sbsa-2026.2.1.6.run"
    container:
      image: ${{ matrix.pytorch_image }}
      options: "--cap-add=SYS_ADMIN --gpus all"
    steps:
      - uses: actions/checkout@v5
      - name: "Install NCU 2026.2.1.0 (CUDA 13.3 Update 1)"
        run: |
          curl -L -o ncu_installer.run "${{ matrix.platform.ncu_installer_url }}"
          chmod +x ncu_installer.run
          ./ncu_installer.run -- -noprompt
          rm ncu_installer.run
          echo "/usr/local/NVIDIA-Nsight-Compute-2026.2" >> $GITHUB_PATH
      - name: "Running Tests"
        run: |
          pip install hatch
          hatch run test_cu13:run

  test-cupti:
    name: test-cupti (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        pytorch_image: ["nvcr.io/nvidia/pytorch:26.09-py3"]
        platform:
          - runner: linux-amd64-gpu-h100-latest-1
          - runner: linux-arm64-gpu-l4-latest-1
    container:
      image: ${{ matrix.pytorch_image }}
      options: "--cap-add=SYS_ADMIN --gpus all"
    steps:
      - uses: actions/checkout@v5
      - name: "Running Tests (CUPTI backend)"
        run: |
          pip install hatch
          hatch run test_cu13:run -- --tool-init=cupti

  test-ncu-windows:
    name: test-ncu (windows-amd64-gpu-a100-latest-1)
    runs-on: windows-amd64-gpu-a100-latest-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: "Install NCU 2026.3.1 (CUDA 13.4)"
        shell: pwsh
        run: |
          curl.exe -L -o ncu_installer.msi "https://developer.nvidia.com/downloads/assets/tools/secure/nsight-compute/2026_3_1/nsight_compute-windows-x86_64-2026.3.1.2.msi"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i','ncu_installer.msi','/quiet','/norestart','/l*v','ncu_install.log'
          # 0 = installed, 3010 = installed, reboot pending
          if ($p.ExitCode -notin 0, 3010) {
            Get-Content ncu_install.log -Tail 50
            throw "Nsight Compute installer failed with exit code $($p.ExitCode)"
          }
          Remove-Item ncu_installer.msi
          # On Windows the ncu launcher is ncu.bat at the install root; the
          # actual binary lives under target\windows-desktop-win7-x64.
          $ncuDir = "C:\Program Files\NVIDIA Corporation\Nsight Compute 2026.3.1"
          if (-not (Test-Path "$ncuDir\ncu.bat")) { throw "ncu.bat not found in $ncuDir" }
          & "$ncuDir\ncu.bat" --version
          $ncuDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: "Install MSVC Redistributable (required by torch)"
        shell: pwsh
        run: |
          curl.exe -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $p = Start-Process vc_redist.x64.exe -Wait -PassThru -ArgumentList '/install','/quiet','/norestart'
          # 0 = installed, 1638 = newer version already present, 3010 = success, reboot pending
          if ($p.ExitCode -notin 0, 1638, 3010) { throw "vc_redist failed: $($p.ExitCode)" }
          Remove-Item vc_redist.x64.exe
      # The repro below needs only cuda-core; torch, cuTile and the project
      # itself are not installed while we chase the crash.
      # - name: "Install PyTorch (CUDA 13.2)"
      #   shell: pwsh
      #   run: |
      #     pip install torch --index-url https://download.pytorch.org/whl/cu132
      # - name: "Install cuTile"
      #   shell: pwsh
      #   run: |
      #     pip install cuda-tile[tileiras]
      # - name: "Install project"
      #   shell: pwsh
      #   run: |
      #     pip install -e ".[cu13]"
      #     pip install pytest pytest-cov
      - name: "Install cuda-core"
        shell: pwsh
        run: |
          pip install "cuda-core[cu13]"
      - name: "Enable crash dumps"
        shell: pwsh
        run: |
          # Scoped to python.exe: the NVIDIA display container also crashes on
          # this runner and would otherwise fill the folder.
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $k -Force | Out-Null
          Set-ItemProperty -Path $k -Name DumpFolder -Value "C:\dumps" -Type ExpandString
          Set-ItemProperty -Path $k -Name DumpCount  -Value 5 -Type DWord
          Set-ItemProperty -Path $k -Name DumpType   -Value 1 -Type DWord
          New-Item -ItemType Directory -Force -Path C:\dumps | Out-Null
          # Self-hosted runner: drop dumps left over from earlier runs.
          Remove-Item C:\dumps\* -Force -ErrorAction SilentlyContinue
      - name: "Minimal repro: NCU injection, no nsight-python"
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Drives the NCU injection library directly (in-process profiling,
          # ncu --mode attach) with a cuda-core kernel. No torch, no nsight.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $repro = @'
          import os
          import ctypes
          import subprocess
          import shutil
          from cuda.core import Device, LaunchConfig, Program, launch

          BEGIN_SYMBOL = "nvInjBeginProfiling"
          STOP_SYMBOL = "nvInjEndProfiling"

          begin_profiling_symbol = None
          end_profiling_symbol = None
          ncu_path = None

          # Parameter structs matching nvComputeInj.h
          class ProfilingParams(ctypes.Structure):
              _fields_ = [
                  ("structSize", ctypes.c_size_t),
                  ("pPriv", ctypes.c_void_p),
              ]


          PROFILING_PARAMS = ProfilingParams(
              structSize=ctypes.sizeof(ProfilingParams),
              pPriv=None,
          )

          def get_injection_library_path(ncu_path: str) -> str:
              result = subprocess.run(
                  [ncu_path, "--list-injection-path-64"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              )
              lines = result.stdout.splitlines()
              path = lines[0].strip()
              return path


          def init_injection() -> None:
              """Load the injection library callables or set error message on failure."""

              global begin_profiling_symbol
              global ncu_path
              global end_profiling_symbol

              ncu_path = shutil.which("ncu")
              if ncu_path is None:
                  raise Exception("ncu not found - add ncu to your $PATH")
              inj_dir = get_injection_library_path(ncu_path)

              inj_name = "cuda-injection.dll" if os.name == "nt" else "libcuda-injection.so"
              inj_lib_path = os.path.join(inj_dir, inj_name)
              os.environ["NVTX_INJECTION64_PATH"] = inj_lib_path
              os.environ["NV_COMPUTE_PROFILER_PERFWORKS_DIR"] = inj_dir
              os.environ["NV_COMPUTE_PROFILER_IN_PROCESS"] = "1"

              lib = ctypes.CDLL(inj_lib_path)
              if lib is None:
                  return

              begin_profiling_symbol = getattr(lib, BEGIN_SYMBOL, None)
              end_profiling_symbol = getattr(lib, STOP_SYMBOL, None)
              if begin_profiling_symbol is None or end_profiling_symbol is None:
                  return

          if __name__ == "__main__":

              print(f"PID: {os.getpid()}")

              init_injection()

              ret_code = begin_profiling_symbol(ctypes.byref(PROFILING_PARAMS))
              ncu_command = f'"{ncu_path}" --mode attach --metrics gpu__time_duration.sum -f -o report'
              ncu_process = subprocess.Popen(ncu_command, shell=True)

              src = r"""
          extern "C" __global__ void dummy_kernel() {}
          """

              dev = Device()
              dev.set_current()
              stream = dev.create_stream()

              mod = Program(src, "c++").compile("cubin")
              kernel = mod.get_kernel("dummy_kernel")
              cfg = LaunchConfig(grid=1, block=1)
              launch(stream, cfg, kernel)
              launch(stream, cfg, kernel)
              dev.sync()

              ret_code = end_profiling_symbol(ctypes.byref(PROFILING_PARAMS))

              return_code = ncu_process.wait()
              if return_code != 0:
                  print(f"ncu process exit code = {return_code}")
          '@
          Set-Content -Path ncu_injection_repro.py -Value $repro
          python ncu_injection_repro.py
          Write-Host "=== exit $LASTEXITCODE  |  ncu injection repro"
          exit 0
      # Disabled while we collect a crash dump for the injection repro above.
      # - name: "Running Tests"
      #   shell: pwsh
      #   env:
      #     # On Windows matplotlib defaults to the TkAgg backend, and tkinter
      #     # is not properly configured on the runner. This is a headless
      #     # runner and no GUI is required, so force the non-interactive
      #     # backend. Headless Linux falls back to Agg already.
      #     MPLBACKEND: Agg
      #     # pytest arms faulthandler only for the duration of the session and
      #     # removes it again in pytest_unconfigure, so a native crash during
      #     # interpreter shutdown leaves no trace. Arm it from interpreter
      #     # startup instead. Costs nothing unless the process actually faults.
      #     PYTHONFAULTHANDLER: 1
      #   run: |
      #     python -m pytest -v -rA --debug=pytestdebug.log --junitxml=report.xml
      #     # Capture pytest's own exit code before anything else runs, so the
      #     # step still reports it after printing the debug log.
      #     $code = $LASTEXITCODE
      #     Write-Host "=== pytest exit code: $code ==="
      #     if (Test-Path pytestdebug.log) {
      #       Write-Host "=== pytestdebug.log ==="
      #       Get-Content pytestdebug.log
      #     }
      #     exit $code
      - name: "List crash dumps"
        if: always()
        shell: pwsh
        run: Get-ChildItem C:\dumps -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-crash-dumps
          path: C:\dumps\*.dmp
          if-no-files-found: warn
      - name: "Show crash details"
        if: always()
        shell: pwsh
        run: |
          # Windows logs an Application Error for a fail-fast termination,
          # recording which module was executing when the process died.
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} -MaxEvents 10 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, Message

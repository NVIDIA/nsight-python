name: "CI"

on:
  push:
    branches:
      - "main"
      - "pull-request/[0-9]+"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: "Running Lint"
        run: |
          pip install hatch
          hatch run lint:check

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: "Building Docs"
        run: |
          pip install hatch
          hatch run docs:build

  test-linux:
    name: test (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: linux-amd64-gpu-h100-latest-1
            ncu_installer_url: "https://developer.nvidia.com/downloads/assets/tools/secure/nsight-compute/2026_2_1/nsight_compute-linux-x86_64-2026.2.1.6.run"
          - runner: linux-arm64-gpu-l4-latest-1
            ncu_installer_url: "https://developer.nvidia.com/downloads/assets/tools/secure/nsight-compute/2026_2_1/nsight_compute-linux-sbsa-2026.2.1.6.run"
    container:
      image: nvcr.io/nvidia/pytorch:26.06-py3
      options: "--cap-add=SYS_ADMIN --gpus all"
    steps:
      - uses: actions/checkout@v5
      - name: "Install NCU 2026.2.1.0 (CUDA 13.3 Update 1)"
        run: |
          curl -L -o ncu_installer.run "${{ matrix.platform.ncu_installer_url }}"
          chmod +x ncu_installer.run
          ./ncu_installer.run -- -noprompt
          rm ncu_installer.run
          echo "/usr/local/NVIDIA-Nsight-Compute-2026.2" >> $GITHUB_PATH
      - name: "DEBUG: matplotlib backend (throwaway)"
        run: |
          pip install hatch
          hatch run test_cu13:python -c "import matplotlib; print('backend =', matplotlib.get_backend())"
      - name: "Running Tests"
        run: |
          pip install hatch
          hatch run test_cu13:run

  test-windows:
    name: test (windows-amd64-gpu-a100-latest-1)
    runs-on: windows-amd64-gpu-a100-latest-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: "Install NCU 2026.2.1.0 (CUDA 13.3 Update 1)"
        shell: pwsh
        run: |
          curl.exe -L -o ncu_installer.msi "https://developer.nvidia.com/downloads/assets/tools/secure/nsight-compute/2026_2_1/nsight_compute-windows-x86_64-2026.2.1.6.msi"
          Start-Process msiexec.exe -Wait -ArgumentList '/i ncu_installer.msi /quiet /norestart'
          Remove-Item ncu_installer.msi
          "C:\Program Files\NVIDIA Corporation\Nsight Compute 2026.2.1" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: "Install MSVC Redistributable (required by torch c10.dll)"
        shell: pwsh
        run: |
          curl.exe -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $p = Start-Process vc_redist.x64.exe -Wait -PassThru -ArgumentList '/install','/quiet','/norestart'
          # 0 = installed, 1638 = newer version already present, 3010 = success, reboot pending
          if ($p.ExitCode -notin 0, 1638, 3010) { throw "vc_redist failed: $($p.ExitCode)" }
          Remove-Item vc_redist.x64.exe
      - name: "Install PyTorch (CUDA 13.2)"
        shell: pwsh
        run: |
          pip install hatch
          hatch run test_cu13:pip install torch --index-url https://download.pytorch.org/whl/cu132
      - name: "Install cuTile"
        shell: pwsh
        run: |
          hatch run test_cu13:pip install cuda-tile[tileiras]
      - name: "Verify environment"
        shell: pwsh
        run: |
          hatch run test_cu13:python -c "import ctypes; ctypes.CDLL('msvcp140.dll'); print('msvcp140 ok')"
          hatch run test_cu13:python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
          hatch run test_cu13:python -c "import nvidia.cu13 as p; print(list(p.__path__))"
          hatch run test_cu13:python -c "from cuda.tile import _compile; print(_compile._find_compiler_bin().path)"
      - name: "DEBUG: matplotlib backend (throwaway)"
        shell: pwsh
        run: |
          hatch run test_cu13:python -c "import matplotlib; print('backend =', matplotlib.get_backend())"
      - name: "Running Tests"
        shell: pwsh
        run: |
          pip install hatch
          hatch run test_cu13:run
